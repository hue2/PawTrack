name: pawtrack

services:
  web:
    build: ./src/PawTrack.Web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379,connectTimeout=1000
      ConnectionStrings__PawTrack: Host=postgres;Port=5432;Database=pawtrack;Username=pawtrack;Password=pawtrack;Maximum Pool Size=15;Timeout=3;Command Timeout=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    shm_size: 1gb
    environment:
      POSTGRES_DB: pawtrack
      POSTGRES_USER: pawtrack
      POSTGRES_PASSWORD: pawtrack
      PAWTRACK_SCALE: ${PAWTRACK_SCALE:-50}
    ports:
      - "5432:5432"
    volumes:
      # Scripts in this folder run only when the data volume is empty, restoring the backup on first start.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Checks over TCP: the init scripts run against a socket-only server, so this passes only after the restore finishes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pawtrack -d pawtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxclients", "50"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      BASE_URL: http://web:8080
    command: ["run", "/scripts/browse-visits.js"]
    depends_on:
      - web

volumes:
  pgdata:
